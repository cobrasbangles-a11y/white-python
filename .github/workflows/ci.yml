name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  test:
    # The display probes, process-group kills and browser discovery are all
    # platform-specific, so this has to run on all three for real.
    name: test (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ['18', '20', '22']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Test
        run: npm test

  smoke:
    name: smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Every source file parses
        shell: bash
        run: |
          for f in bin/*.js src/*.js test/*.js; do node --check "$f"; done

      # These must work on a machine with no browser and no display attached:
      # a CI runner is a decent proxy for a broken user setup.
      - name: CLI survives a machine with no browser
        shell: bash
        run: |
          node bin/white-python.js version
          node bin/white-python.js help
          node bin/white-python.js feeds
          node bin/white-python.js status
          node bin/white-python.js stats
          node bin/white-python.js displays
          node bin/white-python.js config
          node bin/white-python.js doctor

      # `white-python stats | head` used to die with an unhandled EPIPE.
      - name: Output survives being piped into a short reader
        shell: bash
        run: |
          for c in help feeds status stats config doctor displays; do
            node bin/white-python.js "$c" 2>&1 | head -1 > /dev/null
            code=${PIPESTATUS[0]}
            test "$code" -eq 0 || { echo "$c exited $code when piped"; exit 1; }
          done

      # The recycled-pid guard is only real if the command line can be read.
      - name: A process's command line is readable on this platform
        shell: bash
        run: |
          node -e "
            const s = require('./src/state');
            const cmd = s.commandLineOf(process.pid);
            if (cmd === null) {
              console.log('command line NOT readable on ' + process.platform +
                          ' — the recycled-pid guard falls back to the pid check here');
              process.exit(0);
            }
            if (!/node/i.test(cmd)) throw new Error('unexpected command line: ' + cmd);
            const foreign = ['', 'tmp', 'wp-zzz-not-in-argv', 'profile'].join('/');
            if (s.isOurProcess(process.pid, foreign)) {
              throw new Error('a foreign marker must NOT match: ' + cmd);
            }
            console.log('command line readable and the guard discriminates correctly');
          "

      - name: Hooks always exit 0, even when opening is impossible
        shell: bash
        run: |
          echo '{"session_id":"ci"}' | node bin/white-python.js hook start
          echo '{"session_id":"ci"}' | node bin/white-python.js hook stop --reason question
          echo '{"session_id":"ci"}' | node bin/white-python.js hook stop --reason done

      - name: Install and uninstall leave settings.json intact
        shell: bash
        run: |
          mkdir -p .claude
          echo '{"permissions":{"allow":["Bash(npm test)"]}}' > .claude/settings.json
          node bin/white-python.js install
          grep -q white-python.js .claude/settings.json
          node bin/white-python.js uninstall
          node -e "
            const s = require('./.claude/settings.json');
            const expected = { permissions: { allow: ['Bash(npm test)'] } };
            const actual = JSON.stringify(s);
            if (actual !== JSON.stringify(expected)) {
              throw new Error('uninstall did not restore settings.json: ' + actual);
            }
          "

      - name: Wrapper passes exit codes through
        shell: bash
        run: |
          node bin/white-python.js wrap -- node -e "process.exit(0)"

          set +e
          node bin/white-python.js wrap -- node -e "process.exit(7)"
          code=$?
          set -e
          test "$code" -eq 7 || { echo "expected 7, got $code"; exit 1; }

          set +e
          node bin/white-python.js wrap -- definitely-not-a-real-binary 2>/dev/null
          missing=$?
          set -e
          test "$missing" -eq 127 || { echo "expected 127, got $missing"; exit 1; }

  package:
    name: package contents
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: The published tarball has everything it needs and nothing it doesn't
        run: |
          npm pack --dry-run --json > pack.json
          node -e "
            const files = require('./pack.json')[0].files.map((f) => f.path);
            const required = ['bin/white-python.js', 'src/windows.js', 'src/displays.js', 'README.md', 'package.json'];
            for (const f of required) {
              if (!files.includes(f)) throw new Error('missing from package: ' + f);
            }
            const leaked = files.filter((f) => f.startsWith('test/') || f.endsWith('.log'));
            if (leaked.length) throw new Error('should not be published: ' + leaked.join(', '));
            console.log('package contains ' + files.length + ' files, all expected');
          "
